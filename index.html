<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Tarot Companion</title>
<meta name="description" content="Guía de referencia de tarot sin conexión: energía pura de los 78 arcanos, tiradas y numerología.">
<meta name="theme-color" content="#0d0b10">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tarot Companion">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<!-- CSS modular (tokens -> layout -> componentes -> tema base) -->
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/themes/base.css">
</head>
<body>

<header class="bar">
  <div class="bar-inner">
    <a class="brand" href="#inicio"><b>TAROT</b><span>Companion</span></a>
    <nav class="tabs" id="tabs" aria-label="Secciones">
      <button data-view="inicio" class="active">Inicio</button>
      <button data-view="uso">Cómo usar</button>
      <button data-view="tiradas">Tiradas</button>
      <button data-view="arcanos">Arcanos</button>
      <button data-view="numerologia">Numerología</button>
    </nav>
  </div>
</header>

<!-- Shell mínima: contenedores vacíos que los módulos JS poblarán -->
<main class="wrap">
  <section class="view active" id="view-inicio" aria-label="Inicio"></section>
  <section class="view" id="view-uso" aria-label="Cómo usar el tarot"></section>
  <section class="view" id="view-tiradas" aria-label="Tiradas"></section>
  <section class="view" id="view-arcanos" aria-label="Arcanos"></section>
  <section class="view" id="view-numerologia" aria-label="Numerología"></section>
</main>

<!-- Detail sheet (lo poblará sheet.js) -->
<div class="overlay" id="overlay" aria-hidden="true">
  <div class="scrim" data-close></div>
  <div class="sheet" role="dialog" aria-modal="true" id="sheet"></div>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
